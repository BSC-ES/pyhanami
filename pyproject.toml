[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "pyhanami"
version = "0.1.0"
authors = [
    {name = "Marta Alerany Solé", email = "marta.alerany@bsc.es"},
    {name = "Kai Keller", email = "kai.keller@bsc.es"},
    {name = "Masuo Nakano", email = "masuo@jamstec.go.jp"}
]

description = "pyhanami is a tool designed to evaluate the replicability and scientific skill of Earth System Models"
readme = "README.md"
license = {file = "LICENSES/LICENSE"}
keywords = ["Earth System Models", "replicability", "scientific skill"]
classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: Microsoft",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.7",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]

requires-python = ">=3.7"
dependencies = [
    "beautifulsoup4",
    "cartopy",
    "cftime",
    "cmocean",
    "matplotlib",
    "netCDF4",
    "numpy",
    "pandas",
    "pint",
    "pyyaml",
    "requests",
    "scipy",
    "tqdm",
    "xarray>=2023.1.0,<2025.3.0",
    "xeofs",
    "xesmf>=0.7.0,<0.9.0",
]
# When adding a new dependency, remember to also update: environment.yaml, 
# docs_requirements.txt, and docs/source/conf.py


[tool.setuptools]
include-package-data = true

# Changed data files definition to MANIFEST.in
# [tool.setuptools.package-data]
# "pyhanami" = ["config/*.yaml", "data/*"]


[project.urls]
homepage = "https://github.com/BSC-ES/pyhanami.git"
repository = "https://github.com/BSC-ES/pyhanami.git"
documentation = "https://pyhanami.readthedocs.io/"