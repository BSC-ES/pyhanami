# Create the environment (libmamba is recommended for faster dependency solving):
# conda env create -f environment.yaml --solver=libmamba
#
# If libmamba is unavailable, use the default solver:
# conda env create -f environment.yaml
#
# To use libmamba by default in future conda commands (one-time setup), run:
# conda config --set solver libmamba
#
# Note that this environment includes heavy compiled scientific packages, such as
# xeofs or xesmf, and the classic conda solver can spend a long time backtracking.
# This is why we recommend using the libmamba solver when possible for faster and
# more reliable dependency solving.
  
name:
  pyhanami-env_v0.2.0
channels:
  - conda-forge
  - nodefaults  # To exclude the 'defaults' channel (only use explicitly listed channels)
dependencies:
  - python>=3.11
  - pip
  - tempest-extremes
  - beautifulsoup4
  - cartopy
  - cftime
  - cmocean
  - matplotlib
  - netCDF4
  - numpy
  - pandas
  - pint
  - pyyaml
  - requests
  - scipy
  - statsmodels
  - tqdm
  - xarray>=2023.1.0,<2025.3.0
  - xeofs>=3.0.4
  - xesmf>=0.7.0,<0.9.0
  - pip:
    # Install the pyhanami package in editable mode
    - -e .