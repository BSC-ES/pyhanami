# Create the environment with:
# conda env create -f environment.yaml

name:
  pyhanami-env_v0.2.0
channels:
  - conda-forge
  - nodefaults  # To exclude the 'defaults' channel (only use explicitly listed channels)
dependencies:
  - python>=3.7
  - tempest-extremes
  - beautifulsoup4
  - cartopy
  - cftime
  - cmocean
  - matplotlib
  - netCDF4
  - numpy
  - pandas
  - pint
  - pip
  - pyyaml
  - requests
  - scipy
  - statsmodels
  - tqdm
  - xarray>=2023.1.0,<2025.3.0
  - xeofs
  - xesmf>=0.7.0,<0.9.0
  - pip:
    # Install the pyhanami package in editable mode
    - -e .